name: Integration Test

on:
  workflow_run:
    workflows: [Unit Test]
    types: [completed]

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install node js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Test
        run: tsc && node dist/IntegrationTest.ts