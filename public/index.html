<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users CRUD</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="layout">
    <header>
      <h1>Users</h1>
      <p>Create, read, update, and delete users stored in MongoDB.</p>
    </header>

    <section class="card">
      <h2 id="form-title">Add user</h2>
      <form id="user-form">
        <input type="hidden" id="user-id" />
        <label>
          Username
          <input id="username" name="username" required maxlength="80" />
        </label>
        <label>
          Email
          <input id="email" name="email" type="email" required maxlength="120" />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" required minlength="1" maxlength="120" />
        </label>
        <p id="password-hint" class="hint hidden">Leave password blank to keep the current password.</p>
        <div class="actions">
          <button type="submit" id="submit-btn">Create user</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Cancel edit</button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>All users</h2>
        <button type="button" id="refresh-btn" class="secondary">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr>
              <td colspan="3">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
